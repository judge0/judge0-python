repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: unsupported
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: unsupported
        types: [python]

      - id: pyright
        name: pyright
        entry: uv run pyright src tests
        language: unsupported
        types: [python]
        pass_filenames: false
